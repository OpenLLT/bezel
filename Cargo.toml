[workspace]
resolver = "2"
members = ["crates/theme", "crates/motion", "crates/ui", "apps/gallery"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["clearloop <tianyi.gc@gmail.com>"]
repository = "https://github.com/crabtalk/bezel"
homepage = "https://github.com/crabtalk/bezel"
readme = "README.md"
keywords = ["gpui", "gui", "ui", "components"]
categories = ["gui"]
rust-version = "1.85"

[workspace.dependencies]
bezel-theme = { path = "crates/theme" }
bezel-motion = { path = "crates/motion" }
bezel-ui = { path = "crates/ui" }

# gpui — our own zed fork (full upstream history), pinned to the rev the
# extracted code was written against. The crates.io gpui release (0.2.2,
# 2025-10) is nine months older than this API and fails dependency
# resolution, so a git pin is the only option until zed publishes again.
# Own gpui patches (e.g. a backdrop-blur primitive for ui::material) land
# on this fork.
gpui = { git = "https://github.com/crabtalk/zed", rev = "f14fea9bf3c93797d5161f7440ed418655bc6c57" }
gpui_platform = { git = "https://github.com/crabtalk/zed", rev = "f14fea9bf3c93797d5161f7440ed418655bc6c57" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace.lints.rust]
# The objc 0.2 macros expand `cfg(feature = "cargo-clippy")` checks; declare
# the value so rustc's check-cfg pass doesn't warn on every msg_send! site.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
